name: Test browser animation runtime
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Exercise optional runtime packages used by browser scenes and their native tests.
      - run: python3 -m pip install numpy pillow pygments
      - run: python3 -m unittest discover -s tests -v
      - run: node --test tests/*.test.js
      - run: |
          node --check src/unified-worker.js
          node --check src/manim-client.js
          node --check src/manim-player.js
          node --check src/manim-renderer.js
          node --check src/examples.js
          node --check src/gallery.js
          node --check scripts/render-gallery.cjs
          node --check src/manim-math.js
          node --check src/manim-export.js
          node --check src/manim-video.js
          node --check src/offline.js
          node --check src/render-scheduler.js
          node --check src/detector.js
          node --check src/share-links.js
          node --check src/modl.js
          node --check src/hashbin.js
          node --check src/hashbin-panel.js
          node --check offline-assets.js
          node --check service-worker.js
          node --check tests/browser/smoke.cjs
          node --check tests/browser/sharing.cjs
          node --check tests/browser/gallery.cjs
  browsers:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Serve site
        run: |
          python3 -m http.server 8000 > /tmp/manimonline-http.log 2>&1 &
          sleep 2
      - name: Gallery playback and editor links
        run: node tests/browser/gallery.cjs http://localhost:8000/ ${{ matrix.browser }}
      - name: Rendering and exports
        run: node tests/browser/smoke.cjs http://localhost:8000/ ${{ matrix.browser }}
      - name: Languages and HashBin
        run: node tests/browser/languages.cjs http://localhost:8000/ ${{ matrix.browser }}
      - name: Sharing
        run: node tests/browser/sharing.cjs http://localhost:8000/ ${{ matrix.browser }}
