name: Test browser animation runtime
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Exercise optional runtime packages used by browser scenes and their native tests.
      - run: python3 -m pip install numpy pillow pygments
      - run: python3 -m unittest discover -s tests -v
      - run: node --test tests/*.test.js
      - run: |
          node --check src/unified-worker.js
          node --check src/manim-client.js
          node --check src/manim-player.js
          node --check src/manim-renderer.js
          node --check src/examples.js
          node --check src/manim-math.js
          node --check src/manim-export.js
          node --check src/manim-video.js
          node --check src/offline.js
          node --check src/render-scheduler.js
          node --check src/detector.js
          node --check src/share-links.js
          node --check offline-assets.js
          node --check service-worker.js
          node --check tests/browser/smoke.cjs
  browsers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: |
          python3 -m http.server 8000 &
          sleep 2
          node tests/browser/smoke.cjs http://localhost:8000/ chromium firefox webkit
